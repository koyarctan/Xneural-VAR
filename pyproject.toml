[project]
name = "xneural-var"
version = "0.1.0"
description = "Modular GVAR with Neural Granger Causality regularization."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "torch>=2.0",
]

[project.optional-dependencies]
viz = [
  "matplotlib>=3.7",
]
benchmark = [
  "matplotlib>=3.7",
  "scipy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
